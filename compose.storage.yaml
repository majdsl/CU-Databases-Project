# Use only via scripts/run_storage.py: it supplies a unique project name.
services:
  db:
    image: cu-engine-lab-storage-db:local
    build: ./docker/mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${CU_DB_ROOT_PASSWORD:?Existing project .env required}
      MARIADB_DATABASE: engine_lab
      MARIADB_USER: benchmark
      MARIADB_PASSWORD: ${CU_DB_PASSWORD:?Existing project .env required}
    command: ["--sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION", "--query-cache-type=0", "--query-cache-size=0"]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 120s
    volumes:
      - storage_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
  runner:
    image: cu-engine-lab-storage-runner:local
    build: .
    environment:
      DB_HOST: db
      DB_NAME: engine_lab
      DB_USER: benchmark
      DB_PASSWORD: ${CU_DB_PASSWORD:?Existing project .env required}
      STORAGE_EXPERIMENT: isolated-v1
    mem_limit: 512m
    cpus: 1.0
  snapshot:
    image: cu-engine-lab-storage-runner:local
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    volumes:
      - storage_data:/storage:ro
    entrypoint: ["python", "-m", "benchmarks.storage", "snapshot"]
volumes:
  storage_data:
