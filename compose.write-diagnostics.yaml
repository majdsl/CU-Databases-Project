# Only via scripts/run_write_diagnostics.py with a new, validated project name.
services:
  db:
    image: cu-engine-lab-writes-db:local
    build: ./docker/mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${CU_DB_ROOT_PASSWORD:?Existing project .env required}
      MARIADB_DATABASE: engine_lab
      MARIADB_USER: benchmark
      MARIADB_PASSWORD: ${CU_DB_PASSWORD:?Existing project .env required}
    command: ["--innodb-buffer-pool-size=128M", "--innodb-buffer-pool-size-max=128M", "--innodb-buffer-pool-size-auto-min=128M", "--innodb-buffer-pool-dump-at-shutdown=OFF", "--innodb-buffer-pool-load-at-startup=OFF", "--sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION", "--query-cache-type=0", "--query-cache-size=0"]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 120s
    volumes:
      - writes_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
  runner:
    image: cu-engine-lab-writes-runner:local
    build: .
    environment:
      DB_HOST: db
      DB_NAME: engine_lab
      DB_USER: benchmark
      DB_PASSWORD: ${CU_DB_PASSWORD:?Existing project .env required}
      WRITE_DIAGNOSTICS_EXPERIMENT: isolated-v1
    mem_limit: 512m
    cpus: 2.0
volumes:
  writes_data:
