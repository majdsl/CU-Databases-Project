name: Signed-snapshot reconstruction experiment

on:
  pull_request:
    paths:
      - .github/workflows/build-reconstruction.yml
      - docker/reconstruction/**
      - docker/mariadb/**
      - scripts/check_build_reconstruction.py
      - report-tests/test_build_reconstruction.py
      - scripts/build_manifest.py
      - Dockerfile
      - requirements.txt
  push:
    branches: [main]
    paths:
      - .github/workflows/build-reconstruction.yml
      - docker/reconstruction/**
      - docker/mariadb/**
      - scripts/check_build_reconstruction.py
      - report-tests/test_build_reconstruction.py
      - scripts/build_manifest.py
      - Dockerfile
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-builds:
    name: Paired uncached snapshot builds and five-engine readback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated reconstruction experiment without changing the default build
        run: python3 scripts/check_build_reconstruction.py --output "$RUNNER_TEMP/build-reconstruction"
      - name: Retain all build and correctness records, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-snapshot-builds-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-reconstruction/
          include-hidden-files: true # Preserve the checksummed .gitattributes file.
          if-no-files-found: error
          retention-days: 30
