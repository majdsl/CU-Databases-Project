name: Correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Unit tests and five-engine integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI_PROJECT: cu-ci-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable CI output directory
        run: |
          mkdir -p results
          sudo chown 10001:10001 results
      - name: Run documented setup wrapper
        run: python3 scripts/setup_project.py --project-name "$CI_PROJECT"
      - name: MEMORY index correctness smoke (not benchmark evidence)
        run: docker compose -p "$CI_PROJECT" run --rm runner python -m benchmarks.memory_indexes --smoke --power-condition CI-correctness-only
      - name: Isolated cache-pressure lifecycle smoke (not performance evidence)
        run: |
          sudo chown "$(id -u):$(id -g)" results
          python3 scripts/run_cache_pressure.py --smoke --power-condition CI-correctness-only
      - name: Isolated write-diagnostic lifecycle smoke (not performance evidence)
        run: python3 scripts/run_write_diagnostics.py --smoke --power-condition CI-correctness-only
      - name: Frozen-image OpenFlights lifecycle smoke (not performance evidence)
        run: python3 scripts/run_openflights.py --smoke --power-condition CI-correctness-only
      - name: Tutorial SQL, restart and cleanup correctness
        run: python3 scripts/check_tutorial.py --project "$CI_PROJECT"
      - name: Isolated MyRocks compression correctness (not performance evidence)
        run: python3 scripts/run_rocksdb_compression.py --smoke --power-condition CI-correctness-only
      - name: Database diagnostics on failure
        if: failure()
        run: docker compose -p "$CI_PROJECT" logs --no-color --tail=200 db
      - name: Remove disposable CI stack
        if: always()
        run: docker compose -p "$CI_PROJECT" down --volumes --remove-orphans

  stock-tutorial:
    name: Stock tutorial (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      STOCK_PROJECT: cu-stock-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate stock-image Path B on the native architecture
        run: >-
          python3 scripts/check_stock_tutorial.py
          --project "$STOCK_PROJECT"
          --expect-architecture "${{ matrix.arch }}"
          --output "results/stock-tutorial-${{ matrix.arch }}"

  report-validation:
    name: Offline report and tutorial guard tests (normal and optimized Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated reporting dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/report-validation"
          "$RUNNER_TEMP/report-validation/bin/python" -m pip install -r requirements-report.txt
      - name: Fetch checksum-pinned report dataset
        run: |
          "$RUNNER_TEMP/report-validation/bin/python" scripts/fetch_openflights.py
      - name: Validate cloud OpenFlights archive and laptop comparison
        run: |
          "$RUNNER_TEMP/report-validation/bin/python" scripts/check_cloud_openflights.py
          "$RUNNER_TEMP/report-validation/bin/python" -O scripts/check_cloud_openflights.py
      - name: Regenerate all reports and run offline guards with and without optimization
        run: |
          "$RUNNER_TEMP/report-validation/bin/python" -m unittest discover -s report-tests -v
          "$RUNNER_TEMP/report-validation/bin/python" -O -m unittest discover -s report-tests -v
